plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.astral.typer'
    compileSdk 34

    defaultConfig {
        applicationId "com.astral.typer"
        minSdk 24
        targetSdk 34
        versionCode 37
        versionName "1.6.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

// Generate fallback google-services.json if missing (e.g. CI builds)
tasks.register('ensureGoogleServicesJson') {
    doLast {
        def targetFile = file('google-services.json')
        if (!targetFile.exists()) {
            targetFile.text = '''{
  "project_info": {
    "project_number": "1234567890",
    "project_id": "dummy-project",
    "storage_bucket": "dummy-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
        "android_client_info": {
          "package_name": "com.astral.typer"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForBuildOnly"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
'''
        }
    }
}

tasks.matching { it.name.startsWith('process') && it.name.contains('GoogleServices') }.configureEach {
    dependsOn 'ensureGoogleServicesJson'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Color Picker
    // implementation 'com.github.skydoves:colorpickerview:2.2.4' // Using generic libraries for now or custom implementation

    implementation 'com.quickbirdstudios:opencv:4.5.3.0'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.caverock:androidsvg-aar:1.4'

    // ONNX Runtime for LaMa Inpainting
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // PDFBox-Android for PDF Import
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Firebase Crashlytics & Analytics
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
