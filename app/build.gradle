plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.astral.typer'
    compileSdk 34

    defaultConfig {
        applicationId "com.astral.typer"
        minSdk 24
        targetSdk 34
        versionCode 31
        versionName "1.6.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Color Picker
    // implementation 'com.github.skydoves:colorpickerview:2.2.4' // Using generic libraries for now or custom implementation

    implementation 'com.quickbirdstudios:opencv:4.5.3.0'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.caverock:androidsvg-aar:1.4'

    // ONNX Runtime for LaMa Inpainting
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // Google ML Kit Text Recognition for Inpaint mask refinement
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
